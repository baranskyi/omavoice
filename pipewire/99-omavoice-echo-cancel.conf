# Echo cancellation for omavoice.
#
# Without this the microphone hears the assistant coming out of the laptop
# speakers, the Realtime server-VAD treats that as the user talking, and the
# assistant answers itself — endlessly saying goodbye to its own goodbye.
#
# WebRTC AEC subtracts what is being played from what is being recorded, but it
# can only subtract what it knows about: the reference signal is whatever goes
# through THIS module's sink. So omavoice must both
#   record from  echo-cancel-source
#   play into    omavoice_playback
# Playing into the system's default sink instead leaves the canceller with
# silence as its reference and it removes nothing at all.
#
# Neither node becomes a system default — only omavoice targets them, so
# nothing else on the machine changes behaviour.
#
# Remove this file and `systemctl --user restart pipewire` to undo.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            capture.props = {
                node.name = "omavoice_capture"
            }
            source.props = {
                node.name        = "echo-cancel-source"
                node.description = "Echo-cancelled mic (omavoice)"
            }
            sink.props = {
                node.name        = "omavoice_playback"
                node.description = "Echo-cancel sink (omavoice)"
            }
            playback.props = {
                node.name = "omavoice_playback_out"
            }
            aec.args = {
                webrtc.gain_control          = false
                webrtc.extended_filter       = true
                webrtc.noise_suppression     = true
                webrtc.high_pass_filter      = true
                # The laptop speaker/mic pair has a long, reflective path.
                # Delay agnostic mode tracks the offset instead of assuming it.
                webrtc.delay_agnostic        = true
            }
        }
    }
]
